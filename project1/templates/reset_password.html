{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="stylesheet"
          href="{% static 'css/login.css' %}">

</head>

<body>

<header class="header">

    <div class="logo">
        Smart Journey Assistant
    </div>

    <nav class="navbar">

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'login' %}">
            Login
        </a>

    </nav>

</header>


<section class="login-section">

    <div class="login-container">

        <div class="login-heading">

            <h1>
                Reset Password
            </h1>

            <p>
                Create your new password.
            </p>

        </div>


        <form class="login-form"
              method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    required>

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required>

            </div>


            {% if error %}

                <p style="color:red;">
                    {{ error }}
                </p>

            {% endif %}


            <button
                type="submit"
                class="login-btn">

                Reset Password

            </button>

        </form>

    </div>

</section>

</body>

</html>
